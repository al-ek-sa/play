<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Locus</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="body-lv">
<div class="level-header">
  <h1 class="title-th title-lv">Уровень 1. Тема: Квадрат</h1>
  <div class="level-header-actions">
    <button id="history--1lv" class="button-base-lv-th">история</button>
    <button id="exit--1lv" class="button-base-lv-th">выйти</button>
  </div>
</div>
    <div class="section-lv">
      <form id="form-lv1" class="form--lv">
        <p class="text-lv-tz">Дан центр квадрата a = 3. Необходимо найти точку Х если известно, что центр имеет координату (2,3), а координата у = 4.</p>
        <label class="label--lv">Ответ (введите числа через пробел):
          <input name="answer" class="input--lv" type="number" placeholder="Введите ответ" min="-10" max="10" step="0.5">
        </label>
        <button id="answer--lv1" class="button-base-lv-th button-lv-form">Отправить на проверку</button>
      </form>
      <canvas id="canvas-lv-one" class="canvas--lv" width="450" height="450"></canvas>
    </div>
<div id="true" class="modal">
  <div class="container--1 div--th">
    <output class="text-lv-tz">правильно</output>
    <div class="section-success">
      <button id="success--next--lv1" class="button-base-lv-th">дальше</button>
      <button id="success--exit--lv1" class="button-base-lv-th">выйти</button>
    </div>
  </div>
</div>
<div id="false" class="modal">
  <div class="container--1 div--th">
    <output class="text-lv-tz">неверно</output>
    <button id="failure-lv1" class="button-base-lv-th">хорошо</button>
  </div>
</div>
</body>
  <script type="module" src="../js/app.js"></script>
</html>
