<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locus</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="body-lv">

<div class="level-header">
  <h1 class="title-th title-lv">Уровень 2. Тема: Круг</h1>
  <div class="level-header-actions">
    <button id="history--2lv" class="button-base-lv-th">история</button>
    <button id="exit--2lv" class="button-base-lv-th">выйти</button>
  </div>
</div>

<div class="section-lv">
  <form id="form-lv2" class="form--lv">
    <p class="text-lv-tz">
      Дан круг с центром в точке O. Известно, что центр находится
      в координате (2, 3), а радиус равен 4. Необходимо найти точку X
      если координата y = 4 и точка лежит на правой границе круга.
    </p>
    <label class="label--lv" for="answer-lv2">Ответ (введите число):</label>
    <input id="answer-lv2" name="answer" class="input--lv" type="number"
           placeholder="Введите ответ" min="-10" max="10" step="0.5">
    <button id="answer--lv2" class="button-base-lv-th button-lv-form">
      Отправить на проверку
    </button>
  </form>
  <canvas id="canvas-lv-two" class="canvas--lv" width="450" height="450"></canvas>
</div>

<div id="true-lv2" class="modal">
  <div class="container--1 div--th">
    <output class="text-lv-tz">правильно</output>
    <div class="section-success">
      <button id="success--next--lv2" class="button-base-lv-th">дальше</button>
      <button id="success--exit--lv2" class="button-base-lv-th">выйти</button>
    </div>
  </div>
  <img src="../img/bear.png" class="bear" alt="Мишка">
</div>

<div id="false-lv2" class="modal">
  <div class="container--1 div--th">
    <output class="text-lv-tz">неверно</output>
    <button id="failure-lv2" class="button-base-lv-th">хорошо</button>
  </div>
  <img src="../img/bear.png" class="bear" alt="Мишка">
</div>

<script type="module" src="../js/app.js"></script>
</body>
</html>
