ServerName localhost

DirectoryIndex html/index.html index.html

<Location "/fcgi-bin/check">
    CGIPassAuth On
</Location>

ProxyPass "/fcgi-bin/check" "fcgi://localhost:6060/"

<IfModule mod_headers.c>
    <FilesMatch "\.(html|js|css)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</IfModule>