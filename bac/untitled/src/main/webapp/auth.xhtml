<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:pt="jakarta.faces.passthrough" lang="ru">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Редактор области</title>
    <link rel="stylesheet" href="/css/editor.css"/>
    <script type="module" src="/js/main.js"></script>
</h:head>

<h:body>

    <header class="header">
        <h1>Аккаунт главного редактора</h1>
        <h:form id="logoutForm" prependId="false">
            <h:commandButton id="logout" value="Выйти из аккаунта" action="#{editorBean.logout}" styleClass="logout-button"/>
        </h:form>
    </header>

    <main class="editor">

        <section class="graph-section">
            <h2>Область попаданий</h2>
            <canvas id="areaCanvas" width="600" height="600" aria-label="Графическое отображение области попаданий"></canvas>
        </section>

        <section class="settings-section">
            <h2>Настройки области</h2>

            <h:form id="areaForm" prependId="false" styleClass="settings-form">
                <h:messages id="messages" styleClass="messages" globalOnly="true"/>

                <div class="settings-field">
                    <h:outputLabel for="offsetY" value="Смещение по Y" styleClass="settings-label"/>
                    <h:inputText id="offsetY" value="#{editorBean.offsetY}" required="true" requiredMessage="Введите смещение по Y" pt:type="number" pt:step="any" styleClass="settings-input"/>
                    <h:message for="offsetY" styleClass="field-message"/>
                </div>

                <div class="settings-field">
                    <h:outputLabel for="offsetX" value="Смещение по X" styleClass="settings-label"/>
                    <h:inputText id="offsetX" value="#{editorBean.offsetX}" required="true" requiredMessage="Введите смещение по X" pt:type="number" pt:step="any" styleClass="settings-input"/>
                    <h:message for="offsetX" styleClass="field-message"/>
                </div>

                <div class="settings-field">
                    <h:outputLabel for="rotation" value="Угол поворота (градусы)" styleClass="settings-label"/>
                    <h:inputText id="rotation" value="#{editorBean.rotation}" required="true" requiredMessage="Введите угол поворота" pt:type="number" pt:step="any" styleClass="settings-input"/>
                    <h:message for="rotation" styleClass="field-message"/>
                </div>

                <h:commandButton id="saveArea" value="Сохранить изменения" action="#{editorBean.saveArea}" styleClass="save-button"/>
            </h:form>
        </section>
    </main>
</h:body>
</html>
