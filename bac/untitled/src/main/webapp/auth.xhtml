<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" lang="ru">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Редактор области</title>
    <link rel="stylesheet" href="./css/editor.css"/>
</h:head>

<h:body>

    <header class="header">
        <h1>Аккаунт главного редактора</h1>

        <h:form>
            <h:commandButton value="Выйти из аккаунта" action="#{editorBean.logout}"/>
        </h:form>
    </header>

    <main class="editor">

        <section class="graph-section">
            <h2>Область попаданий</h2>
            <canvas id="areaCanvas" width="600" height="600"></canvas>
        </section>

        <section class="settings-section">
            <h2>Настройки области</h2>

            <h:form id="areaForm">

                <label for="offsetY">
                    Смещение по Y
                </label>

                <h:inputText id="offsetY" value="#{editorBean.offsetY}" required="true"/>

                <label for="offsetX">
                    Смещение по X
                </label>

                <h:inputText id="offsetX" value="#{editorBean.offsetX}" required="true"/>

                <label for="rotation">
                    Угол поворота (градусы)
                </label>

                <h:inputText id="rotation" value="#{editorBean.rotation}" required="true"/>

                <h:commandButton value="Сохранить изменения" action="#{editorBean.saveArea}"/>

            </h:form>

        </section>

    </main>

    <script type="module" src="../js/main.js"></script>

</h:body>
</html>
