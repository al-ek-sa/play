<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" lang="ru">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Регистрация</title>
    <link rel="stylesheet" href="/css/login.css"/>
    <script type="module" src="/js/main.js"></script>
</h:head>

<h:body>
    <main>
        <h:form id="register" prependId="false">
            <h1>Регистрация</h1>
            <h:outputLabel for="username" value="Логин"/>
            <h:inputText id="username" value="#{registerBean.username}" required="true" requiredMessage="Введите логин"/>
            <h:message for="username"/>
            <h:outputLabel for="password" value="Пароль"/>
            <h:inputSecret id="password" value="#{registerBean.password}" required="true" requiredMessage="Введите пароль"/>
            <h:message for="password"/>
            <h:outputLabel for="confirmPassword" value="Повторите пароль"/>
            <h:inputSecret id="confirmPassword" value="#{registerBean.confirmPassword}" required="true" requiredMessage="Повторите пароль"/>
            <h:message for="confirmPassword"/>
            <button type="submit">Зарегистрироваться</button>
            <p>
                Уже есть аккаунт?
                <h:outputLink value="/login.xhtml">
                    Войти
                </h:outputLink>
            </p>
        </h:form>
    </main>
</h:body>
</html>
