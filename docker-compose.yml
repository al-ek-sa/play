services:
  db:
    image: postgres:18
    container_name: lab3-postgres
    environment:
      POSTGRES_DB: lab3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - lab3_data:/var/lib/postgresql
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab3"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lab3-backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  front:
    build:
      context: .
      dockerfile: Dockerfile.front
    container_name: lab3-front
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  lab3_data:
