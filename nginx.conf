server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index html/index.html;

    location / {
        try_files $uri $uri/ /html/index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

